[project]
name = "duckless"
version = "0.5.0"
description = "Serverless DuckDB on GCP: run SQL or your own code on a right-sized VM in your project, then tear it down"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
keywords = [
    "duckdb", "serverless", "google-cloud", "gcp", "bigquery", "cloud-run", "cloud-batch",
    "ducklake", "data-engineering", "sql", "etl",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: SQL",
    "Topic :: Database",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "typer>=0.15",
    "google-cloud-batch>=0.17",
    "google-cloud-config>=0.7",
    "google-cloud-compute>=1.20",
    "google-cloud-logging>=3.11",
    "google-cloud-run>=0.16",
    "google-cloud-storage>=2.18",
]

[project.urls]
Homepage = "https://tosun-si.github.io/duckless/"
Documentation = "https://tosun-si.github.io/duckless/"
Repository = "https://github.com/tosun-si/duckless"
Changelog = "https://github.com/tosun-si/duckless/releases"
Issues = "https://github.com/tosun-si/duckless/issues"

[project.scripts]
duckless = "duckless.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = ["spike", "runtime"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
