name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'spike/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'spike/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/duckless-runner
  CACHE_IMAGE: ghcr.io/${{ github.repository_owner }}/duckless-runner-cache

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag upstream
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  terraform:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: duckless/terraform
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false && terraform validate

  runner-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to ghcr.io with GITHUB_TOKEN, on main only
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build and load for the smoke test
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          set: |
            *.output=type=docker
        env:
          IMAGE: duckless-runner
          CACHE_IMAGE: "" # no registry login on PRs; the push below reuses this builder's cache
          TAGS: ci

      - name: Smoke test
        run: docker run --rm --entrypoint python duckless-runner:ci /usr/local/src/app/smoke_test.py

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push edge image
        if: env.PUBLISH == 'true'
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          push: true
        env:
          TAGS: edge,sha-${{ github.sha }}
