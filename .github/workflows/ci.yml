name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**/*.md', 'spike/**']
  pull_request:
    branches: [main]
    paths-ignore: ['**/*.md', 'spike/**']
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  AR_LOCATION: europe
  AR_PROJECT: duckless-public

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag upstream
        with:
          enable-cache: true
      - run: uv python install 3.13
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  terraform:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [terraform/modules/duckless, infra/public]
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v4
      - run: terraform fmt -check -recursive
        working-directory: ${{ matrix.dir }}
      - run: terraform init -backend=false -input=false && terraform validate
        working-directory: ${{ matrix.dir }}

  runner-image:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # WIF, used on main only
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Build and load for the smoke test
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          set: |
            *.output=type=docker
        env:
          TAGS: ci

      - name: Smoke test
        run: docker run --rm --entrypoint python duckless/runner:ci /usr/local/src/app/smoke_test.py

      - if: env.PUBLISH == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_CI_SA }}

      - if: env.PUBLISH == 'true'
        uses: google-github-actions/setup-gcloud@v3

      - if: env.PUBLISH == 'true'
        run: gcloud auth configure-docker ${{ env.AR_LOCATION }}-docker.pkg.dev --quiet

      - name: Push edge image
        if: env.PUBLISH == 'true'
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          push: true
        env:
          REGISTRY: ${{ env.AR_LOCATION }}-docker.pkg.dev/${{ env.AR_PROJECT }}/duckless
          CACHE_REGISTRY: ${{ env.AR_LOCATION }}-docker.pkg.dev/${{ env.AR_PROJECT }}/ci-cache
          TAGS: edge,sha-${{ github.sha }}
