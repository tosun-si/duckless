name: Release

on:
  push:
    tags: ['v*.*.*']
  # Re-run a release from an existing tag (e.g. after a failed publish), built from that tag's
  # commit: the published artifacts always match the tag, without moving it.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to publish
        required: true
      skip_image:
        description: Skip the runner image (already published for this tag)
        type: boolean
        default: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/${{ github.repository_owner }}/duckless-runner
  CACHE_IMAGE: ghcr.io/${{ github.repository_owner }}/duckless-runner-cache

# Each job lists the permissions it needs; any job-level list drops the others to none,
# so `contents: read` must be repeated wherever the repository is checked out.
jobs:
  check-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - id: version
        name: Tag must match the package and plugin versions (bumped by the release-prep PR)
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+ ]]; then
            echo "::error::'$TAG' is not a vX.Y.Z tag"
            exit 1
          fi
          version="${TAG#v}"
          for file in pyproject.toml runtime/pyproject.toml; do
            declared=$(grep -m1 '^version = ' "$file" | cut -d'"' -f2)
            if [ "$declared" != "$version" ]; then
              echo "::error file=$file::version $declared does not match tag $TAG"
              exit 1
            fi
          done
          declared=$(python3 -c "import json; print(json.load(open('duckless/plugin/.claude-plugin/plugin.json'))['version'])")
          if [ "$declared" != "$version" ]; then
            echo "::error file=duckless/plugin/.claude-plugin/plugin.json::version $declared does not match tag $TAG"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  runner-image:
    needs: check-version
    if: ${{ !inputs.skip_image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write # sign the provenance attestation (Sigstore, keyless)
      attestations: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: push
        uses: docker/bake-action@v7
        with:
          source: .
          files: docker-bake.hcl
          push: true
        env:
          TAGS: ${{ needs.check-version.outputs.version }}
      - uses: actions/attest-build-provenance@v4
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ fromJSON(steps.push.outputs.metadata).runner['containerimage.digest'] }}
          push-to-registry: true

  pypi:
    needs: [check-version, runner-image]
    # Runs when the image job succeeded or was skipped on purpose.
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/duckless/${{ needs.check-version.outputs.version }}
    permissions:
      contents: read
      id-token: write # PyPI Trusted Publishing, no API token
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: astral-sh/setup-uv@v10.2.0 # no floating major tag upstream
      - run: uv build
      - uses: pypa/gh-action-pypi-publish@release/v1

  github-release:
    needs: [check-version, pypi]
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - name: Release intro = body of the annotated tag message
        run: |
          # A shallow checkout can see an annotated tag as lightweight: fetch the tag object itself.
          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          git for-each-ref "refs/tags/${TAG}" --format='%(contents:body)' > release-intro.md
          cat release-intro.md
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.TAG }}
          body_path: release-intro.md
          generate_release_notes: true # appended after the intro: PRs merged since the previous tag
          prerelease: ${{ contains(env.TAG, '-') }}
