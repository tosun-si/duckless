[project]
name = "duckless-runtime"
version = "0.4.0"
description = "DuckLess runner: DuckDB tuned for the VM, GCS via ADC"
requires-python = ">=3.13"
dependencies = [
    "duckdb==1.5.6",
    "numpy>=2.3",  # DuckDB Python UDFs need it
    "pyarrow>=21",  # vectorized (arrow) UDFs
    "pydantic>=2.11",  # validating job configuration (examples/03-raw-validation)
    "pytz>=2025.2",  # DuckDB needs it to return TIMESTAMPTZ values to Python (now(), ducklake_snapshots)
    "pyyaml>=6.0",  # job configuration files
]

[build-system]
requires = ["uv_build>=0.8,<0.13"]
build-backend = "uv_build"
